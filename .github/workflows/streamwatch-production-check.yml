name: StreamWatch production build check

on:
  push:
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
